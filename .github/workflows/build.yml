name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o VeerCAD_Motion_Android.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        working-directory: veercad-motion
        run: |
          mkdir -p app/src/main/assets/www/js
          (cd app/src/main/assets/www/js && curl -fsSL -O https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js && curl -fsSL -O https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js && curl -fsSL -O https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js)
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../VeerCAD-Motion.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: VeerCAD-Motion.apk
