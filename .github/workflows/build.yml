name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: unzip -o VeerCAD_Motion_Android.zip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licences
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "sdk.dir=$SDK" > veercad-motion/local.properties
          TOOL=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$TOOL" --licenses > /dev/null || true
          yes | "$TOOL" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        working-directory: veercad-motion
        run: |
          mkdir -p app/src/main/assets/www/js
          (cd app/src/main/assets/www/js && curl -fsSL -O https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js && curl -fsSL -O https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js && curl -fsSL -O https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js)
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../VeerCAD-Motion.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: VeerCAD-Motion.apk
